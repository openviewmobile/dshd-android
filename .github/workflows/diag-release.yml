name: Diagnose full release

on:
  push:
    paths:
      - .github/workflows/diag-release.yml

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ROOTFS_URL: https://github.com/openviewmobile/dshd-android/releases/download/rootfs-0.3.2/dshd-rootfs-arm64-webview-pnpm-appboot-mobile-fixed22-nativepdf-sanitized.tar.xz
      ROOTFS_SHA256: 0c91ec900505963afe6cb7e2240bd0161a1d59bd46dc1a6e3a397c7395b18635
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download rootfs and keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          curl -fL "$ROOTFS_URL" -o "$RUNNER_TEMP/rootfs.tar.xz"
          echo "$ROOTFS_SHA256  $RUNNER_TEMP/rootfs.tar.xz" | sha256sum -c -
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Capture release build
        env:
          DSHD_EMBED_ROOTFS: ${{ runner.temp }}/rootfs.tar.xz
          DSHD_KEYSTORE: ${{ runner.temp }}/release.jks
          DSHD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSHD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSHD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          chmod +x gradlew scripts/build-release-apk.sh
          scripts/build-release-apk.sh > /tmp/build.log 2>&1
          STATUS=$?
          echo "status=$STATUS"
          tail -250 /tmp/build.log
          cp /tmp/build.log release-build.txt
          exit 0
      - name: Upload/commit log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B diag
          git add release-build.txt
          git commit -m 'ci: release build diagnostic' || true
          git push origin diag --force
