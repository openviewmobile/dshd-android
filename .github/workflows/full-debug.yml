name: Full debug APK

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: Public HTTPS URL of a sanitized rootfs .tar.xz
        required: true
      rootfs_sha256:
        description: SHA-256 of the rootfs archive
        required: true

permissions:
  contents: read

jobs:
  full-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download and verify rootfs
        env:
          ROOTFS_URL: ${{ inputs.rootfs_url }}
          ROOTFS_SHA256: ${{ inputs.rootfs_sha256 }}
        run: |
          test -n "$ROOTFS_URL"
          printf '%s' "$ROOTFS_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$'
          curl -fL --retry 3 --connect-timeout 20 "$ROOTFS_URL" -o "$RUNNER_TEMP/rootfs.tar.xz"
          echo "$ROOTFS_SHA256  $RUNNER_TEMP/rootfs.tar.xz" | sha256sum -c -
          ls -lh "$RUNNER_TEMP/rootfs.tar.xz"
      - name: Build full debug APK
        env:
          DSHD_EMBED_ROOTFS: ${{ runner.temp }}/rootfs.tar.xz
        run: |
          chmod +x app/gradlew
          cd app
          ./gradlew --no-daemon :app:assembleDebug
      - name: Checksums
        run: |
          APK=app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK"
          cat "$APK.sha256"
      - name: Upload full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dshd-android-full-debug-${{ github.sha }}
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
