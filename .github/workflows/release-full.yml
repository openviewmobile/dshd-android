name: Full APK release

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: Public HTTPS URL of the sanitized rootfs .tar.xz
        required: true
        default: https://github.com/openviewmobile/dshd-android/releases/download/rootfs-0.3.2/dshd-rootfs-arm64-webview-pnpm-appboot-mobile-fixed22-nativepdf-sanitized.tar.xz
      rootfs_sha256:
        description: SHA-256 of that rootfs archive
        required: true
      tag:
        description: Existing tag to attach the APK to
        required: true
        default: v0.3.2
permissions:
  contents: write

jobs:
  full-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ROOTFS_URL: ${{ inputs.rootfs_url || vars.ROOTFS_URL }}
      ROOTFS_SHA256: ${{ inputs.rootfs_sha256 || vars.ROOTFS_SHA256 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install compile SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs
        run: |
          test -n "$ROOTFS_URL" || { echo "ROOTFS_URL is required"; exit 2; }
          printf '%s' "$ROOTFS_SHA256" | grep -Eq '^[0-9a-fA-F]{64}$' || { echo "ROOTFS_SHA256 must be 64 hex"; exit 2; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is required"; exit 2; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required"; exit 2; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required"; exit 2; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required"; exit 2; }

      - name: Download and verify sanitized rootfs
        run: |
          curl -fL --retry 3 --connect-timeout 20 "$ROOTFS_URL" -o "$RUNNER_TEMP/rootfs.tar.xz"
          echo "$ROOTFS_SHA256  $RUNNER_TEMP/rootfs.tar.xz" | sha256sum -c -

      - name: Decode release keystore
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build full embedded-rootfs release APK
        env:
          DSHD_EMBED_ROOTFS: ${{ runner.temp }}/rootfs.tar.xz
          DSHD_KEYSTORE: ${{ runner.temp }}/release.jks
          DSHD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSHD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSHD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x app/gradlew scripts/build-release-apk.sh
          scripts/build-release-apk.sh

      - name: Verify and checksum
        run: |
          APK=dist/dshd-android-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dshd-android-full-${{ github.sha }}
          path: |
            dist/dshd-android-release.apk
            dist/dshd-android-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "DSHD for Android 0.3.2" \
              --notes "Full embedded-rootfs APK built on GitHub Actions."
          gh release upload "$RELEASE_TAG" \
            dist/dshd-android-release.apk \
            dist/dshd-android-release.apk.sha256 --clobber
